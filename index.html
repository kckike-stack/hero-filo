<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HERO · Filo Academia — Afilado de cuchillos de cocina · CDMX</title>
<meta name="description" content="El especialista en afilar y reparar cuchillos: japoneses, de marca prestigiada o con valor sentimental. A mano, con piedras de agua. Recolección en CDMX y toda la República.">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --washi:#f5f2ec; --washi2:#ede8de; --paper:#fffdf8;
  --sumi:#1a1918; --sumi2:#54514b; --hai:#98938a; --line:#ddd6c9;
  --aka:#b23a2a; --aka-d:#8e2e20;
  --mincho:'Shippori Mincho',serif; --gothic:'Zen Kaku Gothic New',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--gothic);background:var(--washi);color:var(--sumi);line-height:1.65;-webkit-font-smoothing:antialiased}
img{display:block;width:100%;height:100%;object-fit:cover}
button{font-family:inherit;cursor:pointer}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto}

/* ---------- NAV ---------- */
nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(245,242,236,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav-in{max-width:1180px;margin:0 auto;height:70px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none}
.hanko{width:30px;height:30px;background:var(--aka);color:#fff;font-family:var(--mincho);font-size:11px;line-height:1.1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:5px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.28);flex-shrink:0}
.logo-tx{font-family:var(--mincho);font-weight:600;font-size:1.12rem;letter-spacing:.24em;line-height:1.1}
.logo-sub{display:block;font-family:var(--gothic);font-weight:500;font-size:.58rem;letter-spacing:.34em;color:var(--sumi2);text-transform:uppercase;margin-top:2px}
.nav-r{display:flex;align-items:center;gap:26px}
.nav-r a.nl{font-size:.82rem;font-weight:500;color:var(--sumi2);text-decoration:none;letter-spacing:.04em}
.nav-r a.nl:hover{color:var(--aka)}
.cart-btn{position:relative;display:flex;align-items:center;gap:8px;background:none;border:1px solid var(--line);border-radius:2px;padding:9px 16px;font-size:.8rem;font-weight:500;color:var(--sumi)}
.cart-btn:hover{border-color:var(--sumi)}
.cart-count{background:var(--aka);color:#fff;font-size:.66rem;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px}

/* ---------- HERO ---------- */
.hero{margin-top:70px;display:grid;grid-template-columns:1.05fr 1fr;min-height:580px;position:relative}
.hero-l{position:relative;display:flex;flex-direction:column;justify-content:center;padding:70px 70px 70px max(24px,calc((100vw - 1180px)/2 + 24px))}
.hero-kick{display:flex;align-items:center;gap:10px;font-size:.72rem;letter-spacing:.28em;text-transform:uppercase;color:var(--sumi2);margin-bottom:26px}
.hero-kick .hanko{width:22px;height:22px;font-size:8px;border-radius:4px}
.hero h1{font-family:var(--mincho);font-weight:600;font-size:clamp(2.1rem,4.2vw,3.5rem);line-height:1.18;letter-spacing:.01em;margin-bottom:22px}
.hero h1 em{font-style:normal;color:var(--aka)}
.hero p{color:var(--sumi2);font-size:1rem;max-width:440px;margin-bottom:30px}
.btn{display:inline-block;background:var(--sumi);color:var(--washi);border:none;border-radius:2px;padding:15px 30px;font-size:.82rem;font-weight:500;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;text-align:center;transition:.25s}
.btn:hover{background:var(--aka)}
.btn.ghost{background:transparent;color:var(--sumi);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--sumi);background:transparent;color:var(--sumi)}
.hero-acts{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:26px}
.hero-note{border-left:2px solid var(--aka);padding-left:14px;font-size:.84rem;color:var(--sumi2);max-width:400px}
.vert{position:absolute;right:26px;top:70px;writing-mode:vertical-rl;font-family:var(--mincho);font-size:.95rem;letter-spacing:.4em;color:var(--hai)}
.hero-r{position:relative;min-height:420px}
.hero-r img{position:absolute;inset:0}
.hero-r::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,var(--washi) 0%,transparent 12%)}

/* ---------- SECTIONS ---------- */
section{padding:96px 24px;position:relative}
.sec-label{display:flex;align-items:center;gap:12px;font-size:.72rem;letter-spacing:.3em;text-transform:uppercase;color:var(--sumi2);font-weight:500;margin-bottom:18px}
.sec-label .jp{font-family:var(--mincho);font-size:1rem;letter-spacing:.1em;color:var(--aka);text-transform:none}
.sec-label::after{content:'';flex:0 0 40px;height:1px;background:var(--line)}
h2.sec{font-family:var(--mincho);font-weight:600;font-size:clamp(1.7rem,3vw,2.4rem);line-height:1.25;margin-bottom:16px}
.sec-sub{color:var(--sumi2);font-size:.98rem;max-width:560px}

/* ---------- COTIZADOR ---------- */
.quote{background:var(--washi2)}
.q-card{background:var(--paper);border:1px solid var(--line);border-radius:3px;margin-top:44px;overflow:hidden;box-shadow:0 18px 50px rgba(26,25,24,.06)}
.q-body{padding:42px}
.q-step{margin-bottom:34px}
.q-lbl{font-size:.72rem;letter-spacing:.24em;text-transform:uppercase;color:var(--sumi2);font-weight:500;margin-bottom:14px}
.q-lbl b{color:var(--aka);font-weight:700;margin-right:6px}
.grp{font-family:var(--mincho);font-size:.86rem;color:var(--hai);letter-spacing:.14em;margin:0 0 10px}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.opts.three{grid-template-columns:repeat(3,1fr)}
.opt{border:1px solid var(--line);background:var(--washi);border-radius:2px;padding:15px 12px;text-align:center;transition:.2s}
.opt:hover{border-color:var(--sumi2)}
.opt.sel{border-color:var(--sumi);background:var(--sumi);color:var(--washi)}
.opt .t{font-weight:500;font-size:.88rem;margin-bottom:2px}
.opt .d{font-size:.72rem;color:var(--sumi2)}
.opt.sel .d{color:var(--hai)}
.opt .p{font-family:var(--mincho);font-weight:600;font-size:.98rem;margin-top:6px}
.opt.dis{opacity:.42;cursor:not-allowed}
.opt.dis:hover{border-color:var(--line)}
.base-svc{display:flex;align-items:center;gap:14px;border:1px solid var(--sumi);background:var(--washi2);border-radius:2px;padding:16px;cursor:default}
.base-svc .box2{width:20px;height:20px;border:1.5px solid var(--sumi);background:var(--sumi);border-radius:2px;flex-shrink:0;display:grid;place-items:center;color:#fff;font-size:.72rem}
.base-svc .tx{flex:1}
.base-svc .tx b{display:block;font-size:.9rem;font-weight:500}
.base-svc .tx small{color:var(--sumi2);font-size:.78rem}
.base-svc .pr{font-family:var(--mincho);font-weight:600}
.chk{border:1px solid var(--line);background:var(--washi);border-radius:2px;padding:15px 12px;text-align:center;position:relative;transition:.2s}
.chk:hover{border-color:var(--sumi2)}
.chk.sel{border-color:var(--aka);background:var(--washi2)}
.chk .box{position:absolute;top:8px;right:8px;width:18px;height:18px;border:1.5px solid var(--hai);border-radius:2px;display:grid;place-items:center;color:#fff;font-size:.68rem;transition:.2s}
.chk.sel .box{background:var(--aka);border-color:var(--aka)}
.chk .t{font-weight:500;font-size:.86rem}
.chk .d{font-size:.72rem;color:var(--sumi2);margin-top:2px}
.chk .p{font-family:var(--mincho);font-weight:600;font-size:.95rem;margin-top:6px}
.chk-hint{font-size:.76rem;color:var(--hai);margin-top:10px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:2px;background:var(--washi)}
.qty button{width:46px;height:46px;background:none;border:none;font-size:1.15rem;color:var(--sumi)}
.qty button:hover{background:var(--washi2)}
.qty span{width:54px;text-align:center;font-weight:500;font-family:var(--mincho);font-size:1.05rem}
.ins{display:flex;align-items:center;gap:14px;border:1px solid var(--line);background:var(--washi);border-radius:2px;padding:16px;cursor:pointer;transition:.2s}
.ins:hover{border-color:var(--sumi2)}
.ins.sel{border-color:var(--sumi);background:var(--washi2)}
.ins .box2{width:20px;height:20px;border:1.5px solid var(--hai);border-radius:2px;flex-shrink:0;display:grid;place-items:center;color:#fff;font-size:.72rem;transition:.2s}
.ins.sel .box2{background:var(--aka);border-color:var(--aka)}
.ins .tx{flex:1}
.ins .tx b{display:block;font-size:.9rem;font-weight:500}
.ins .tx small{color:var(--sumi2);font-size:.78rem}
.ins .pr{font-family:var(--mincho);font-weight:600}
.q-bar{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:26px 42px;background:var(--sumi);color:var(--washi);flex-wrap:wrap}
.q-bar .lbl{font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--hai)}
.q-bar .amt{font-family:var(--mincho);font-weight:600;font-size:2.1rem;line-height:1.15}
.q-bar .btn{background:var(--washi);color:var(--sumi)}
.q-bar .btn:hover{background:var(--aka);color:#fff}
.q-note{margin-top:18px;font-size:.8rem;color:var(--sumi2);text-align:center;max-width:680px;margin-left:auto;margin-right:auto}

/* ---------- PRECIOS ---------- */
.p-cols{display:grid;grid-template-columns:1fr 1fr;gap:56px;margin-top:44px}
.p-cols h3{font-family:var(--mincho);font-size:1.05rem;font-weight:600;letter-spacing:.06em;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--sumi)}
.p-cols h3.mt{margin-top:34px}
.p-row{display:flex;align-items:baseline;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.p-row .dots{flex:1;border-bottom:1px dotted var(--hai);transform:translateY(-4px)}
.p-row
